<header class="site-header">
  <div class="site-header__inner">
    <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
      <span class="site-brand__mark" aria-hidden="true">QC</span>
      <span>{{ site.title }}</span>
    </a>

    <button class="site-nav__toggle" type="button" aria-expanded="false" aria-controls="site-navigation" aria-label="Toggle navigation">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav id="site-navigation" class="site-nav" aria-label="Primary navigation">
      {% for link in site.data.navigation.main %}
        {% if link.url contains 'http' %}
          {% assign nav_url = link.url %}
        {% else %}
          {% assign nav_url = link.url | relative_url %}
        {% endif %}
        <a href="{{ nav_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
