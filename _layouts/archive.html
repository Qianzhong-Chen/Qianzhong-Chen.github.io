---
layout: default
---

<main id="main" class="site-main" role="main">
  <div class="archive page-shell">
    {% unless page.hide_title %}
      <header class="page-header">
        {% if page.eyebrow %}<span class="page-header__eyebrow">{{ page.eyebrow }}</span>{% endif %}
        <h1>{{ page.title }}</h1>
        {% if page.excerpt %}<p>{{ page.excerpt }}</p>{% endif %}
      </header>
    {% endunless %}
    <div class="page-content">
      {{ content }}
    </div>
  </div>
</main>
