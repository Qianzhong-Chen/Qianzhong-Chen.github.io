---
layout: default
---

<main id="main" class="site-main{% if page.url == '/' %} site-main--home{% endif %}" role="main">
  <article class="page-shell" itemscope itemtype="http://schema.org/CreativeWork">
    {% unless page.hide_title %}
      <header class="page-header">
        {% if page.eyebrow %}<span class="page-header__eyebrow">{{ page.eyebrow }}</span>{% endif %}
        {% if page.title %}<h1 itemprop="headline">{{ page.title }}</h1>{% endif %}
        {% if page.excerpt %}<p>{{ page.excerpt }}</p>{% endif %}
      </header>
    {% endunless %}

    <section class="page-content" itemprop="text">
      {{ content }}
    </section>
  </article>
</main>
